# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include kitty-themes/themes/IC_Orange_PPL.conf
allow_remote_control yes
# END_KITTY_THEME

# ── 字体 ──
font_family Maple Mono NF CN
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto
adjust_line_height 0
adjust_column_width 0

# ── 背景图 + 透明模糊 ──
background_image /home/leo/图片/wallpapers/wallhaven-d6j79o.png
background_image_layout scaled
background_opacity 0.75
background_blur 64

# ── 窗口 (隐藏标题栏) ──
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 1100
initial_window_height 700
window_padding_width 8
window_margin_width 0
confirm_os_window_close 0

# ── 鼠标: 选中即复制 / 中键粘贴 ──
copy_on_select clipboard
paste_actions quote-urls-at-prompt
click_interval 0.5
focus_follows_mouse no

# ── 光标 ──
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# ── 滚动 ──
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ── 标签栏 ──
tab_bar_style powerline
tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_margin_width 4
tab_title_template "{index}: {title}"

# ── 常用快捷键 ──
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+tab next_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f show_scrollback_search
map ctrl+shift+u unicode_input
map ctrl+plus increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 reset_font_size
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# ── 杂项 ──
enable_audio_bell no
visual_bell_duration 0.2
mouse_hide_wait 2.0
underline_hyperlinks always
url_color #769ff0
strip_trailing_spaces smart
shell_integration enabled
